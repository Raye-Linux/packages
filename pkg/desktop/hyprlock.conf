# Raye's lock screen. ~/.config/hypr/hyprlock.conf replaces it.

general {
    hide_cursor = true
}

background {
    path = /usr/share/backgrounds/raye.png
    color = rgb(0e0a16)
    blur_passes = 2
    brightness = 0.6
}

label {
    text = $TIME
    color = rgb(f3eaff)
    font_size = 64
    font_family = DejaVu Sans
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    size = 280, 48
    outline_thickness = 2
    outer_color = rgb(b46cff)
    inner_color = rgb(1a1326)
    font_color = rgb(f3eaff)
    check_color = rgb(7b3cff)
    fail_color = rgb(d946ef)
    placeholder_text = password
    fail_text = nope
    dots_center = true
    fade_on_empty = false
    rounding = 6
    position = 0, -40
    halign = center
    valign = center
}
