# Raye's default Hyprland setup.
#
# This is only read when you don't have a config of your own: anything
# at ~/.config/hypr/hyprland.conf (or .lua) replaces it entirely. To
# start from this one, copy it there and edit away.
#
# It's the old .conf format on purpose. Hyprland takes a .lua from
# /etc/xdg over a .conf in your home, so a .lua here would hide yours.

monitor = , preferred, auto, 1

# what the session starts with. hyprland-session already brought up the
# session bus and PipeWire
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpaper

$term = foot
$menu = rofi -show drun

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(b46cff) rgb(d946ef) 45deg
    col.inactive_border = rgb(2a2238)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    shadow {
        enabled = false
    }
    # blur is pretty, and a laptop GPU pays for it on every frame
    blur {
        enabled = false
    }
}

animations {
    enabled = true
}

input {
    # empty means "ask xkbcommon", which goes by XKB_DEFAULT_LAYOUT, and
    # /etc/profile sets that from /etc/keymap (see raye-keymap)
    kb_layout =
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

misc {
    background_color = rgb(0e0a16)
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

$mod = SUPER

bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, Escape, exec, hyprlock

# screenshots go to the clipboard, a region with shift
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# by key code rather than name, so they're the number row whatever the
# layout says those keys are (on azerty they're & é " and so on)
bind = $mod, code:10, workspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# volume keys, through WirePlumber. l: they work on the lock screen too
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
