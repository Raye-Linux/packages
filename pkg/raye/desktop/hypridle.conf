# Raye's idle rules. ~/.config/hypr/hypridle.conf replaces them.
#
# There's no logind, so nothing calls lock_cmd; the listeners lock the
# screen themselves.

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
